<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Voice Calendar">
  <!-- Full bleed, and the mark kept inside the central 80%: a maskable icon is
       cropped to whatever shape the platform prefers, and the rounded corners
       favicon.svg draws for itself would be clipped twice. -->
  <rect width="48" height="48" fill="#f2ead8"/>
  <circle cx="24" cy="24" r="13" fill="none" stroke="#e8b84b" stroke-width="3"/>
  <circle cx="24" cy="24" r="8" fill="#0e0e10"/>
</svg>
