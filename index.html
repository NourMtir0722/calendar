<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Named here as well as in the stylesheet so the browser starts fetching it
      alongside the CSS rather than after parsing it. `crossorigin` is required
      even for a same-origin font: without it the preload is made in a different
      mode than the real request and the file is simply fetched twice.
    -->
    <link rel="preload" href="/fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The INK ground. The page repaints per four-month block; this is the value it opens on. -->
    <meta name="theme-color" content="#0e0e10" />
    <meta
      name="description"
      content="A journal you speak instead of write: one voice note per day, on a wall calendar. Everything stays in your browser."
    />
    <!--
      The unfurl. Absolute URLs, because a crawler resolves these against
      nothing: a relative path here is simply a card with no picture. The image
      is 1200x630, which is the ratio both X and iMessage crop to, so nothing
      of the plate is lost on the way.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voice Calendar" />
    <meta property="og:url" content="https://calendar.nawwara.studio/" />
    <meta property="og:title" content="Voice Calendar" />
    <meta
      property="og:description"
      content="A journal you speak instead of write: one voice note per day, on a wall calendar. Everything stays in your browser."
    />
    <meta property="og:image" content="https://calendar.nawwara.studio/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A wall calendar in near-black and cream: a still life of game feathers under an ASCII scan layer, above a month of circled days."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@noormtir" />

    <!--
      Added to the home screen, this stops being a page Safari may clear after
      seven days without a visit and becomes an installed app it leaves alone.
      That exemption is the only reliable defence against the timer, which is
      why "add to home screen" is offered as a feature rather than left to
      whoever thinks to look for it.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voice Calendar" />
    <title>Voice Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
